name: TTRacing
description: >-
  TTRacing is a Malaysian gaming chair and gaming furniture brand selling
  ergonomic gaming chairs, office chairs, and accessories through an online
  Shopify storefront at ttracing.my. The store is agent-commerce ready: it
  publishes an llms.txt and agents.md with explicit agent instructions, a UCP
  (Universal Commerce Protocol) discovery document at /.well-known/ucp, and a
  hosted Model Context Protocol (MCP) endpoint that lets AI shopping agents
  search the catalog, build carts, and run buyer-approved checkout. Human
  customer accounts are handled via Shopify's OpenID Connect / OAuth 2.0
  authorization server. Surfaced as a 500 Global portfolio company and enriched
  from live probes of its public agent-facing surface.

generated: '2026-07-21'
method: searched
source: https://ttracing.my/llms.txt, https://ttracing.my/agents.md, and https://ttracing.my/.well-known/ucp
  (probed 2026-07-21)
name: TTRacing UCP Shopping MCP
status: published
status_raw: active
kind: hosted-remote
transport: streamable-http
protocol: Universal Commerce Protocol (UCP)
endpoint: https://ttracing.myshopify.com/api/ucp/mcp
alias_endpoint: https://ttracing.my/api/ucp/mcp
content_type: application/json
supported_versions:
- '2026-04-08'
- '2026-01-23'
discovery: https://ttracing.my/.well-known/ucp
spec: https://ucp.dev/2026-04-08/specification/overview/
openrpc_schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
platform: Shopify
authentication: tools/list requires an agent profile URI (UCP discovery handshake). A bare JSON-RPC tools/list
  without a profile returns error -32001 "UCP discovery failed / Missing profile uri". Read-only browsing
  (below) needs no auth.
verification:
  discovery_http_status: 200
  mcp_endpoint_http_status: 422
  mcp_endpoint_note: Endpoint is live and responds with a UCP JSON-RPC error object requiring an agent
    profile; full tool schemas are gated behind that handshake.
tools:
- name: search_catalog
  capability: dev.ucp.shopping.catalog.search
  description: Find products in the store matching a buyer's intent.
- name: create_cart
  capability: dev.ucp.shopping.cart
  description: Create a cart and add desired items.
- name: create_checkout
  capability: dev.ucp.shopping.checkout
  description: Start the purchase flow for a cart.
- name: update_checkout
  capability: dev.ucp.shopping.fulfillment
  description: Set shipping address and fulfillment method on a checkout.
- name: complete_checkout
  capability: dev.ucp.shopping.checkout
  description: Finalize the purchase. Requires explicit, contemporaneous buyer approval of payment (buyer-approval
    invariant).
capabilities:
- dev.ucp.shopping.cart
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
- dev.ucp.shopping.discount
- dev.ucp.shopping.order
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.shopify.catalog
payment_handlers:
- com.google.pay
- dev.shopify.card
rules:
- Checkout must not complete payment without explicit buyer consent.
- MCP endpoint is rate-limited per IP; back off on HTTP 429.
- Pass context.address_country and context.currency for accurate pricing.
deployment:
  mode: remote
  verified: searched
  tools: 5
  checked: '2026-08-12'
  source: catalog MCP census
